<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>World Cup 2026 Mexico Guide</title>
    <link href="icon.svg" rel="icon" type="image/svg+xml">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<header>
    <div>
        <h1>World Cup 2026 Mexico Guide</h1>
    </div>
    <p>Explore Mexico City, Guadalajara, and Monterrey as host city destinations for World Cup 2026 travel.</p>
</header>
<main>
    <section data-layout="mapSection">
        <div aria-label="Google Map" id="map"></div>
        <aside data-layout="cityPanel">
            <button type="button" data-city-button="0">Mexico City</button>
            <button type="button" data-city-button="1">Guadalajara</button>
            <button type="button" data-city-button="2">Monterrey</button>
        </aside>
    </section>
</main>
<script>
    window.initialiseMapPage = async () => {
        const {initialiseMapPage} = await import("./index.js");
        initialiseMapPage();
    };
</script>

<!-- Google Maps -->
<script
        async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCfjx8fhVFeMj08EbVfEiVS9AUz-RmN2BM&loading=async&callback=initialiseMapPage&libraries=marker,places">
</script>
</body>
</html>
